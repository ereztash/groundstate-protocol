name: CI

on:
  pull_request:
    branches: [main]

# Cancel older runs when a PR is updated — saves minutes and signals only
# track the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run test

  e2e:
    # Production-bundle smoke tests in a real browser. This is the layer
    # that catches the kind of runtime crash a green `bun run build` can
    # still hide (see commit 75dc540 — manualChunks forwardRef bug).
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Build production bundle
        # build:ssg, not build: e2e/prerender.spec.ts asserts on
        # dist/<route>/index.html, and plain `vite build` never writes those.
        # The spec landed in cbcd8b5 while this step still said `bun run build`,
        # so the prerender half of the suite could not pass here even though
        # deploy.yml has always run the prerender step before publishing.
        # Using the composite script rather than a second step keeps this from
        # drifting away from the command deploy actually ships.
        run: bun run build:ssg
      - name: Run smoke tests
        run: bun run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
