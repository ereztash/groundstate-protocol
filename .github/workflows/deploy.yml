name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # No VITE_BASE_PATH: vite.config.ts defaults production builds to a
          # relative base ("./"), so this single artifact works both at the
          # project sub-path (https://<user>.github.io/groundstate-protocol/)
          # and at the apex custom domain root (ereztalshir.co.il) once its DNS
          # is connected — no rebuild needed when the domain flips on.
          # Optional secrets — if unset, the app uses the in-code fallbacks
          # for the form endpoint and silently disables GA tracking.
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
          VITE_APPS_SCRIPT_SECRET: ${{ secrets.VITE_APPS_SCRIPT_SECRET }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}

      - name: Install Playwright Chromium (for prerender)
        run: bunx playwright install --with-deps chromium

      - name: Prerender routes to static HTML (SSG)
        # Bakes each route's rendered HTML + per-page meta into
        # dist/<route>/index.html so crawlers and AI engines see real content.
        run: bun run prerender

      - name: SPA fallback (copy index.html → 404.html)
        # GitHub Pages returns 404 for any path not matching a static file.
        # Routing through React Router requires every unknown path to serve
        # index.html. Copying it to 404.html gives Pages a fallback to do that.
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Enable Pages programmatically if the repo's Pages site doesn't
          # exist yet. Without this, the very first run fails with
          # "Get Pages site failed" because no one configured
          # Settings → Pages → Source: GitHub Actions by hand.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
